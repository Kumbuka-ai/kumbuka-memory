# ===========================================================================
# Test profile.
#
# The datasource is supplied by SubstrateDatabaseResource, which starts a real
# PostgreSQL and points the runtime connection at the service's own role. It
# is NOT supplied by a development service: a development datasource connects
# as a superuser, a superuser bypasses row-level security, and every isolation
# assertion would then pass against a schema with the policies deleted. It
# would also make every privilege probe meaningless, because a superuser
# holds every privilege on everything.
# ===========================================================================

quarkus.devservices.enabled=false

# ---------------------------------------------------------------------------
# Identity, switched off at the realm and supplied per test instead.
#
# The probes here are about what a SUBJECT may reach: which scopes answer for
# it, whose private entries it sees, whether it may write. None of them is
# about how a token is minted, and standing up a realm to answer the first
# question would make every one of them depend on the second — and would make
# the suite unrunnable wherever Keycloak is not reachable.
#
# `@TestSecurity` supplies the identity directly, so `@Authenticated` is still
# enforced and CallerActor still reads the principal it will read in
# production. What is not exercised is the token validation itself, which is
# the extension's and not this service's.
#
# IdentityConfigurationGuard reads this same key and stands down when it is
# false, because a disabled tenant validates no token and there is no
# principal to pin. The guard's green and red states are therefore observed
# against an assembled configuration, and against the SHIPPED
# application.properties, in IdentityConfigurationGuardTest.
quarkus.oidc.tenant-enabled=false

# The tenancy axis under test. Any uuid would do; a recognisable one makes a
# failure message legible.
#
# Set HERE and not in the shipped application.properties, which carries no
# default at all: a guessed tenant is the one fault row-level security cannot
# catch. That the shipped file has no default is asserted by
# TenancyConfigurationGuardTest, which reads it rather than trusting this
# comment.
memory.tenant-id=00000000-0000-0000-0000-000000000001

# Coverage for the static-analysis gate. The quarkus-jacoco extension reads
# these; without them the @QuarkusTest classes run under a classloader the
# report never sees, and nearly all of this service's code would be reported
# as untested — a number that would read as a regression rather than as a
# missing setting.
%test.quarkus.jacoco.data-file=target/jacoco-quarkus.exec
%test.quarkus.jacoco.report=false
%test.quarkus.jacoco.reuse-data-file=true
