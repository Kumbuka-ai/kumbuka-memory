# ===========================================================================
# Test profile.
#
# The datasource is supplied by SubstrateDatabaseResource, which starts a real
# PostgreSQL and points the runtime connection at the service's own role. It
# is NOT supplied by a development service: a development datasource connects
# as a superuser, a superuser bypasses row-level security, and every isolation
# assertion would then pass against a schema with the policies deleted. It
# would also make every privilege probe meaningless, because a superuser
# holds every privilege on everything.
# ===========================================================================

quarkus.devservices.enabled=false

# The tenancy axis under test. Any uuid would do; a recognisable one makes a
# failure message legible.
memory.tenant-id=00000000-0000-0000-0000-000000000001

# Coverage for the static-analysis gate. The quarkus-jacoco extension reads
# these; without them the @QuarkusTest classes run under a classloader the
# report never sees, and nearly all of this service's code would be reported
# as untested — a number that would read as a regression rather than as a
# missing setting.
%test.quarkus.jacoco.data-file=target/jacoco-quarkus.exec
%test.quarkus.jacoco.report=false
%test.quarkus.jacoco.reuse-data-file=true
