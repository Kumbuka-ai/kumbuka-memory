# ===========================================================================
# The memory service.
#
# Every value below that names an environment carries the MEMORY_ prefix and
# a development default that points at localhost. There is no deployment
# hostname in this file, and none belongs here: this repository is public, and
# a default that happens to name a real host is a deployment detail that has
# escaped its deployment.
#
# THE CALLER SURFACE IS REST, AND ONLY REST
#
# Six verbs over HTTP, and no MCP adapter. The assistant-facing entry point of
# this platform is the router, which reaches a service over REST and returns
# its answer unchanged; a per-service protocol adapter is a later question and
# building one here because the core has one would be building a second entry
# point nobody asked for.
#
# IDENTITY IS A RESOURCE SERVER, WITH ONE PLATFORM AUDIENCE
#
# ADR-0034, as re-drawn on 2026-09-21: from outside, the platform is one
# resource with one audience. Every recipient validates the unchanged token
# itself against the identifier its own installation configures and derives
# the acting identity from its own validated security identity — never from a
# field of the call. This service is such a recipient whether or not a facade
# stood in front of it, and it never assumes a validated predecessor.
# ===========================================================================

quarkus.application.name=memory

quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n
quarkus.log.level=INFO
# INFO in production. DEBUG is the trace inside a verb and is switched on when
# somebody is looking; INFO is the completed transition and the service start,
# which is what a running deployment should say without being asked.
quarkus.log.category."ai.kumbuka.memory".level=INFO

# ---------------------------------------------------------------------------
# Datasource — the RUNTIME connection.
#
# The service connects as its own role and as nothing else. That role OWNS
# NOTHING: it holds `USAGE` on this service's schema and the four privileges
# V2 enumerates on each of its two tables, holds nothing at all on the Flyway
# history table, and carries neither superuser nor BYPASSRLS — which is what
# makes the row-level-security policies bind it.
#
# `quarkus.datasource.username` is also what the privilege probe reads to
# learn which role it is asking about. It is deliberately not duplicated into
# a second key: a probe reading its expectation from a copy would be checking
# that two settings agree rather than that the database is right.
# ---------------------------------------------------------------------------
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${MEMORY_DB_USERNAME:kumbuka_memory}
quarkus.datasource.password=${MEMORY_DB_PASSWORD:change-me-kumbuka-memory}
quarkus.datasource.jdbc.url=${MEMORY_DB_JDBC_URL:jdbc:postgresql://localhost:5432/kumbuka}

# Hibernate's @TenantId filter sends the tenant as the entity field's type
# (String, because the Quarkus tenant-resolver SPI is String-only) while the
# column is `uuid`. Without this, pgjdbc tags the parameter as VARCHAR and
# PostgreSQL rejects `uuid = varchar`; with it, the type is inferred from the
# column instead.
quarkus.datasource.jdbc.additional-jdbc-properties.stringtype=unspecified

# ---------------------------------------------------------------------------
# Flyway — the MIGRATING connection, deliberately a different role.
#
# The migration set creates a role, which is a privileged act, so the migrator
# holds CREATEROLE and CREATE on the database. It also KEEPS ownership of
# everything it creates, including the history table, and grants the runtime
# role the enumerated privileges it needs (V2). An owner can drop a policy and
# disable row-level security; the runtime role must not be able to do either
# to the two tables its own tenant isolation lives on.
#
# `quarkus.flyway.default-schema` is also what the probes read to learn which
# schema is this service's own.
# ---------------------------------------------------------------------------
quarkus.flyway.migrate-at-start=true
quarkus.flyway.default-schema=memory
quarkus.flyway.schemas=memory
quarkus.flyway.create-schemas=true
quarkus.flyway.username=${MEMORY_MIGRATOR_USERNAME:postgres}
quarkus.flyway.password=${MEMORY_MIGRATOR_PASSWORD:postgres}
quarkus.flyway.jdbc-url=${MEMORY_DB_JDBC_URL:jdbc:postgresql://localhost:5432/kumbuka}

# Callbacks are resolved from THIS key by class name and instantiated
# reflectively. The extension does NOT discover them as CDI beans, and a
# callback left out of this line is never registered — with no warning, no
# error, and migrations that run happily without it. The class named here has
# a probe that observes it firing, because that is the only way this line can
# be known to be right.
#
# There is exactly one callback, and no ownership callback: the migrator keeps
# what it creates (V2), so there is nothing to hand over.
quarkus.flyway.callbacks=ai.kumbuka.memory.tenancy.TenantMigrationCallback

# Flyway owns the schema; Hibernate only checks that it matches. Generating
# DDL from the entities would let a mapping change rewrite the database
# without a migration, and a row-level-security policy is exactly the kind of
# thing such a rewrite drops silently. It would also fail outright here: the
# runtime role holds no CREATE on its own schema.
quarkus.hibernate-orm.database.generation=validate
quarkus.hibernate-orm.database.default-schema=memory
quarkus.hibernate-orm.log.sql=false

# Layer 1 of tenant enforcement: Hibernate filters every ORM-routed statement
# on @TenantId. Layer 2 is the database policy (V3). The current-tenant lookup
# runs through HibernateTenantResolver, which reads TenantContext.current().
quarkus.hibernate-orm.multitenant=DISCRIMINATOR

# ---------------------------------------------------------------------------
# Service configuration.
# ---------------------------------------------------------------------------
# The tenancy axis for this deployment. Read by ConfiguredTenantResolver and
# by the Flyway callback that binds the GUC for migrations carrying DML.
#
# NO DEFAULT, AND THE ABSENCE IS THE POINT. A guessed tenant is the one fault
# row-level security cannot catch: every layer below enforces the axis it is
# GIVEN, and none of them can know it was given another estate's. A default
# would not make a missing setting survivable, it would make the service read
# and write somebody else's estate and report a clean start. The value this
# line used to carry was a real tenant id in a development database and no
# tenant at all anywhere else, so it would not even have failed at the first
# query.
#
# There is no line assigning it either: the key is served by the environment
# variable MEMORY_TENANT_ID through the standard mapping, so a deployment
# supplies it and a line here could only put a value back. What refuses the
# start is TenancyConfigurationGuard — before the first migration, and again
# at boot for a start that migrates nothing.

# ---------------------------------------------------------------------------
# Identity — a bearer resource server on the platform's one audience.
#
# Issuer and audience are both checked, so a token minted by another realm of
# the same server, or for another resource, is refused rather than merely
# unauthorised.
#
# The audience default is the platform's own identifier as ADR-0034 fixes it.
# It is not a deployment hostname in the sense this file's header rules out:
# nothing connects to it, it is the name a token must carry, and it is public
# in the specification corpus. A deployment overrides it with
# MEMORY_OIDC_AUDIENCE; the value the production platform uses is set in the
# production window.
#
# An UNSET audience does not fail in Quarkus — it means the audience is not
# validated at all. IdentityConfigurationGuard refuses the start rather than
# letting that happen quietly.
# ---------------------------------------------------------------------------
quarkus.oidc.auth-server-url=${MEMORY_OIDC_ISSUER:http://localhost:8180/realms/kumbuka}
quarkus.oidc.client-id=${MEMORY_OIDC_CLIENT_ID:kumbuka-memory}
quarkus.oidc.application-type=service
quarkus.oidc.token.audience=${MEMORY_OIDC_AUDIENCE:https://platform.kumbuka.ai/mcp}
quarkus.oidc.roles.source=accesstoken
quarkus.oidc.roles.role-claim-path=realm_access/roles

# Authorship is derived from the token's stable subject, never from a display
# name. Quarkus' default for a service application falls through
# upn -> preferred_username -> sub, so an email address can end up recorded as
# the author — and in this service the author is also what a private entry's
# visibility is decided on, so an identifier that can change is one that stops
# matching the entries it wrote. IdentityConfigurationGuard refuses a start on
# any other value.
quarkus.oidc.token.principal-claim=sub

# ---------------------------------------------------------------------------
# Health, beside the verb surface.
#
# Two routes: /q/health/live (the process is running) and /q/health/ready (it
# reached its database as its own role — the datasource extension contributes
# that check, which is why readiness is worth asking rather than a constant
# UP). The orchestrator holds a dependent back on readiness and restarts the
# container on liveness; both are Compose's business and neither is a caller's.
#
# THE PORT IS NOT PUBLISHED BY THIS REPOSITORY. Whether the edge reaches this
# service is a deployment's decision and is made in the stack, not here. What
# changed with the verb surface is that there is now something behind the port
# worth reaching; what did not change is that this file names no host.
#
# The root path is stated rather than left to the default, because the
# container's healthcheck names it literally: two settings that must agree,
# where only one of them is in this repository.
# ---------------------------------------------------------------------------
quarkus.http.port=8080
quarkus.smallrye-health.root-path=/q/health
