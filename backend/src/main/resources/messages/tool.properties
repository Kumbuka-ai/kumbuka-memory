# The description of each call (ToolDescriptions), as the tool list and the
# declaration carry it. Phrased positively (DEC-0043 R21).

create=Lays down a new entry at a free address. The address is the scope and the key; the key begins with the selector. Refused if an entry already stands there: change it with {update}. Callable by anyone who may write to the scope.
read=Reads one entry by its complete address and hands out a fresh conflict token. Reads only. An unused address and one hidden from you are answered alike.
update=Changes the content, the type or the reference of an entry; its address is fixed for its life. Needs the conflict token of the latest read and is refused if the entry changed since. Callable by anyone who may write to the scope.
withdraw=Takes an entry out of force. Final: the entry stays out of force, and the answer says whether its address is free again. Needs the conflict token of the latest read.
query=Lists the entries of a scope page by page, optionally narrowed by selector, type or text. Reads only. Use it to find an address.
digest=Returns everything in force in a scope, whole and grouped by type, with a tally per type. Reads only. Carries the types the scope's digest selection names, or those that types names. Call it once at the start of a session.
