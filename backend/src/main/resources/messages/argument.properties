#
# What each argument is (ArgumentDescriptions). Phrased positively
# (DEC-0043 R21); every optional argument names its default and states that
# null does the same as leaving it out (DEC-0043 R17).

scope=the scope, by its name
address=the complete address of the entry, memory://<scope>/<selector>/<id>
conflictToken=the conflict token the latest read of the entry handed out
fields=an object carrying the values this call writes
createSelector=the selector the entry stands under; the key begins with it
createKey=the key of the entry, <selector>.<id> in lowercase letters, digits, dots and hyphens
createType=the type of the entry, one of the six entry types the schema lists
createContent=the text of the entry, at most {limit} characters
createReference=a provenance URL, stored as given and left unfetched, free of user information and secret parameters; left out or sent as null, the entry stands with the reference unset
updateContent=the text of the entry, at most {limit} characters; left out or sent as null, the entry keeps its current value
updateType=the type of the entry, one of the six entry types the schema lists; left out or sent as null, the entry keeps its current value
updateReference=a provenance URL, stored as given and left unfetched, free of user information and secret parameters; left out or sent as null, the entry keeps its current value
querySelector=the selector whose entries alone are listed; left out or sent as null, every selector of the scope is listed
queryType=the type whose entries alone are listed; left out or sent as null, every type is listed
queryText=a text the entry must contain; left out or sent as null, every entry is listed whatever its text
queryAfter=the next_cursor of the previous page, exactly as that page handed it out; left out or sent as null, the listing starts at its first page
querySort=the order of the listing, id or created_at; left out or sent as null, id
queryDirection=which way the order runs, asc or desc; left out or sent as null, asc
queryPageSize=how many entries one page carries, a whole number from {min} to {max}; left out or sent as null, {fallback}
digestTypes=a list of type names this digest carries; left out or sent as null, the digest carries the types of the scope's digest selection
