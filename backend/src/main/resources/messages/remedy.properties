# What the caller does next, per refusal reason (RefusalRemedies). Every text
# is an instruction, phrased as the act to perform (DEC-0043 R21);
# PositivePhrasingLintTest holds this file to it.

notFound=Check the address, and that you are a member of the scope it names.
scopeLocked=Read the scope with {read}, {query} or {digest}, and write to it once it is unlocked.
scopeReadOnly=Read the scope with {read}, {query} or {digest}, and ask the scope's owner for the write right to change it.
addressMalformed=Write an address as memory://<scope>/<selector>/<id>, and a scope in lowercase letters and digits, in segments joined by single hyphens.
keyMalformed=Write a key as <selector>.<id> in lowercase letters and digits, in segments joined by single dots or hyphens; its selector begins with a letter and runs to at most sixteen characters.
selectorAbsent=Write the key as <selector>.<id>.
selectorReserved=Choose another selector for the key, such as decision, convention or constraint.
selectorMismatched=Make the selector argument and the part of the key before its first dot the same.
alreadyExists=Read the entry with {read} and change it with {update}, or create the new entry under another key.
conflictTokenStale=Read the entry again with {read} and repeat the call with the new conflict token.
updateEmpty=Send at least one of content, type and reference in fields.
typeUnknown=Send each type as one of the values accepts lists.
contentAbsent=Send the text of the entry as content.
contentOversize=Shorten the content to at most {limit} characters, or split it into several entries.
referenceCredentialBearing=Remove the user information and every secret parameter from the URL, then send it again.
pageSizeRejected=Send page_size as a whole number from {min} to {max}.
cursorMalformed=Call {query} again from the first page, or send as after the next_cursor of the page you read last.
cursorForeign=Call {query} again from the first page.
sortUndeclared=Send sort as one of the values accepts lists.
actorUnknown=Authenticate as a subject and call again with that token.
argumentUnknown=Name each argument as one of these.
argumentMissing=Send {name} with the call.
argumentInvalid=Send {path} in the form the input schema of the call gives it.
unexpectedFailure=Report the reference under data.report to the operator of this service.
conflictTokenMissing=Read the entry with {read} and send its conflict token with the call.
fieldImmutable=Send the change in the fields the call changes: content, type and reference.
payloadMalformed=Send the body as the JSON object the call takes.
verbNotCarried=Send a verb the address carries; the Allow header lists its methods.
addressTruncated=Send the call to the address depth that carries it; the Allow header lists the methods of this one.
sessionNotBound=Report the failure to the operator of this service.
surfaceHeader=Send the header once with that value, or leave it out to be answered in the generic vocabulary.
