#
# What went wrong, per refusal reason (RefusalMessages). A finding may be
# stated in the negative. A placeholder names a call, an argument, a position
# or a bound the service declares, and never a value the caller sent
# (DEC-0043 R18).

notFound=nothing is addressed here.
scopeLocked={call} is refused: the scope is locked, and a locked scope takes writes from nobody.
scopeReadOnly={call} is refused: your right in this scope is to read it.
addressMalformed={call} was given an address or a scope in a form this service does not carry.
keyMalformed={call} was given a key or a selector in a form this service does not store.
selectorAbsent={call} was given a key that names no selector. The part of a key before its first dot is the selector the entry stands under.
selectorReserved=The selector of this key is reserved for entries the service lays down itself.
selectorMismatched=The key begins with another selector than the one {call} names.
alreadyExists={call} is refused: an entry already stands at this address.
conflictTokenStale={call} is refused: the entry was changed since you read it.
updateEmpty={call} names nothing to change.
typeUnknown={call} was sent a type outside the entry types, which accepts lists.
contentAbsent={call} needs content: an entry without content is not stored.
contentOversize=The content is longer than an entry holds, which is at most {limit} characters.
referenceCredentialBearing=The reference carries a credential and is not stored.
pageSizeRejected=page_size is outside what {call} takes.
cursorMalformed=after is not a cursor {query} handed out.
cursorForeign=after was handed out by {query} for another scope, selector, type, text, sort or direction.
sortUndeclared=sort names an order {call} does not declare.
actorUnknown=The token is valid but names no subject to act as.
argumentUnknown={call} was sent an argument outside the names it declares at that level, which are: {arguments.joined}.
argumentMissing={call} needs {name}.
argumentInvalid={path} is not of the form {call} takes for it.
unexpectedFailure={call} failed unexpectedly. This is a defect, not a rule. Nothing was changed.
conflictTokenMissing={call} needs the conflict token of the latest read, and none arrived.
fieldImmutable=A field this call sent is fixed for the life of the entry, and offenders names it.
payloadMalformed=The body is not the JSON this address takes.
verbNotCarried=The verb in colon notation is not one this address carries.
addressTruncated=The method is not one this address carries.
sessionNotBound={call} could not be answered: the session the read contract needs was not bound.
surfaceHeader=The header Kumbuka-Surface takes one value, assistant, sent once.
