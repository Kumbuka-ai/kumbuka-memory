# What a next step does (NextStepTexts). Phrased positively (DEC-0043 R21).
# The first set is the assistant surface's, beside a tool name; the generic
# set is the generic surface's, beside a call and an address.

create=Lays down a new entry at a free address.
read=Reads the entry again and hands out a fresh conflict token.
update=Changes the content, the type or the reference; needs the conflict token.
withdraw=Takes the entry out of force; needs the conflict token.
query=Lists the entries of the scope page by page.
digest=Returns everything in force in the scope, grouped by type.
afterRelease=The address is free again; a new entry may be laid down at it.
afterRetirement=Reads the retired entry, which still stands at this address.
genericRead=Read the entry again to get its current state and a fresh conflict token.
genericUpdate=Change the content, the type or the reference, sending the conflict token.
genericWithdraw=Take the entry out of force, sending the conflict token.
genericAfterRelease=Create a new entry at this address, which is free again.
genericAfterRetirement=Read the retired entry, which still stands at this address.
