#
# What each value of a fixed set means (ValueDescriptions). Phrased
# positively (DEC-0043 R21).

typeConstraint=a rule the work obeys, set from outside the work
typeDecision=a choice that was made, with the reason it was made
typeConvention=an agreed way of doing a recurring thing
typeGlossary=the meaning of a term as the scope uses it
typeStatus=where a piece of work stands at a moment
typeOpenQuestion=a question the scope holds open for an answer
sortId=by key, in the order of its characters
sortCreatedAt=by the moment the entry was laid down, then by key
directionAsc=from the lowest value to the highest
directionDesc=from the highest value to the lowest
