#
# The errors of the protocol the assistant surface speaks (ProtocolMessages). What
# arrived -- a method, a tool name -- is the caller's input and is never
# repeated; an error names what this server has instead (DEC-0043 R19, R20).

bodyNotJson=The body is not JSON.
oneRequest=This server takes one JSON-RPC 2.0 request object per call.
notJsonRpc=The request is not a JSON-RPC 2.0 request.
methods=This server speaks the methods initialize, ping, tools/list and tools/call.
paramsObject=The params of tools/call are an object naming the tool and its arguments.
toolUnknown=Call one of the tools in data.accepts, by its name.
argumentsObject=The arguments of a tool call are an object of named arguments.
